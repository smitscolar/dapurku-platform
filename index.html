<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#D94833">
  <title>DapurKu — Ghost Kitchen UMKM</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#D94833; }
    #loader {
      position:fixed; inset:0; background:#D94833;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:999; color:#fff;
      transition:opacity .5s;
    }
    #loader .logo { font-size:48px; margin-bottom:12px; animation:pulse 1.5s infinite; }
    #loader h1 { font-size:24px; font-weight:900; letter-spacing:-.5px; margin-bottom:4px; font-family:-apple-system,sans-serif; }
    #loader p { font-size:12px; opacity:.8; font-family:-apple-system,sans-serif; }
    #loader .bar { width:200px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin-top:20px; overflow:hidden; }
    #loader .bar-fill { height:100%; background:#fff; border-radius:2px; animation:loading 1.5s ease-in-out forwards; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes loading { from{width:0} to{width:100%} }
    iframe {
      width:100%; height:100%;
      border:none; display:block;
      position:fixed; inset:0;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">🍳</div>
    <h1>DapurKu</h1>
    <p>Ghost Kitchen UMKM · Pilot Batam</p>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
  <iframe 
    id="app"
    src="https://1dd5c538-b87b-48b2-9b39-afa3cbd760b1.preview.emergentagent.com/"
    onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none',500)"
    allow="camera;microphone;geolocation"
    title="DapurKu App">
  </iframe>
</body>
</html>
